<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>專案時間軸（甘特圖）· 簡單行銷營運中台</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--panel2:#1e2230;--line:#272c3a;--txt:#e7e9ee;--mut:#9aa3b2;--amber:#ffb454;--green:#27c093;}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Inter","Noto Sans TC",system-ui,"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
  a{color:#4f8cff;text-decoration:none}
  .top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 26px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:30}
  .top h1{font-size:18px;margin:0}.top .sub{color:var(--mut);font-size:12.5px}
  .back{font-size:13px;font-weight:600;padding:7px 13px;border:1px solid var(--line);border-radius:9px;color:var(--txt)}
  .back:hover{background:var(--panel2)}
  .wrap{padding:14px 20px 70px}
  /* 現金彙總 */
  .sumrow{display:flex;gap:14px;flex-wrap:wrap;margin:4px 2px 14px}
  .scard{flex:1;min-width:170px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 16px}
  .scard .lab{font-size:12px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:6px}
  .scard .val{font-size:24px;font-weight:800;margin-top:5px}
  .scard.recv{border-color:rgba(255,180,84,.5)} .scard.recv .val{color:var(--amber)}
  .scard.fore{border-color:rgba(39,192,147,.5)} .scard.fore .val{color:var(--green)}
  .scard .hint{font-size:10.5px;color:var(--mut);margin-top:3px;line-height:1.4}
  .legend{color:var(--mut);font-size:12px;margin:0 2px 12px;line-height:1.9}
  .lg{display:inline-flex;align-items:center;gap:5px;margin-right:14px}
  .swatch{width:30px;height:15px;border-radius:5px;display:inline-block;vertical-align:middle}
  .sw-fore{background:linear-gradient(135deg,#27c093,#27c093cc)}
  .sw-recv{background:rgba(255,180,84,.18);border:1.5px dashed var(--amber)}
  .sw-past{background:rgba(255,255,255,.06);border:1px solid var(--line)}
  .tl{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:calc(100vh - 300px)}
  .scard.pay{border-color:rgba(255,122,133,.5)} .scard.pay .val{color:#ff7a85}
  .scard.med{border-color:rgba(139,147,163,.5)} .scard.med .val{color:#aab2c2}
  .scard.net{border-color:rgba(79,140,255,.6)} .scard.net .val{color:#6aa0ff}
  .grid{min-width:1100px}
  .hrow{display:flex;position:sticky;top:0;z-index:8;background:var(--panel2);border-bottom:1px solid var(--line)}
  .hname{flex:0 0 210px;padding:10px 14px;font-size:11.5px;font-weight:700;color:var(--mut);border-right:2px solid var(--line);position:sticky;left:0;background:var(--panel2);z-index:9}
  .hmon{flex:1;display:flex}
  .hmon .mc{flex:1;text-align:center;padding:10px 0;font-size:11px;font-weight:700;color:var(--mut);border-right:1px solid rgba(39,44,58,.6)}
  .hmon .mc.cur{background:rgba(255,180,84,.22);color:#fff;border-radius:6px 6px 0 0}
  .grp{display:flex;align-items:center;gap:8px;background:#10131a;border-top:1px solid var(--line);padding:7px 14px;font-size:12px;font-weight:800;position:sticky;left:0;z-index:3}
  .grp .gd{width:11px;height:11px;border-radius:3px;flex-shrink:0}
  .grp .gt{color:var(--mut);font-weight:600;font-size:11px;margin-left:auto}
  .row{display:flex;align-items:stretch;height:70px;border-top:1px solid rgba(39,44,58,.45)}
  .row:hover{background:rgba(255,255,255,.025)}
  .rname{flex:0 0 210px;overflow:hidden;padding:8px 12px 8px 26px;font-size:12.5px;font-weight:600;border-right:2px solid var(--line);position:sticky;left:0;background:var(--panel);z-index:2;display:flex;flex-direction:column;justify-content:center;gap:3px;line-height:1.3}
  .row:hover .rname{background:#1b1f29}
  .rname .rdot{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%}
  .rname .nmline{display:flex;align-items:center;min-width:0}
  .rname .tag{flex:0 0 auto;font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;margin-right:6px;background:rgba(255,255,255,.08);color:#cdd3df;letter-spacing:.3px}
  .rname .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pay{display:flex;flex-wrap:wrap;gap:3px 8px;font-size:9.5px;font-weight:700;line-height:1.1;white-space:nowrap}
  .psvc{color:#ff7a85}
  .pmed{color:#9aa3b2}
  .track{flex:1;position:relative}
  .mcol{position:absolute;top:0;bottom:0;border-right:1px solid rgba(39,44,58,.4)}
  .mcol.cur{background:rgba(255,180,84,.07)}
  .bar{position:absolute;top:8px;bottom:8px;border-radius:9px;padding:6px 9px;color:#fff;overflow:hidden;
       box-shadow:0 1px 5px rgba(0,0,0,.4);display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
  /* 每月小方塊：三種狀態 */
  .mblk{align-items:center;justify-content:center;text-align:center;padding:4px 2px;gap:1px;border-radius:8px}
  .mblk .e{font-size:11px;line-height:1}
  .mblk .a{font-size:11px;font-weight:800;line-height:1.05}
  .mblk .t{font-size:8.5px;font-weight:700;opacity:.9;line-height:1}
  .mblk .pastn{font-size:10px;font-weight:700;opacity:.7;line-height:1}
  .mblk.fore{}                                   /* 預計收入：實心 */
  .mblk.recv{box-shadow:none;border:1.5px dashed var(--amber);background:rgba(255,180,84,.16)!important;color:#ffd9a3}  /* 應收帳款 */
  .mblk.past{box-shadow:none;background:rgba(255,255,255,.04)!important;color:var(--mut);opacity:.5}                     /* 已收（過去） */
  /* 一次性 / 期間大方塊 */
  .b-amt{font-size:14px;font-weight:800;line-height:1.1}
  .b-tag{font-size:9px;font-weight:800;letter-spacing:.5px;line-height:1}
  .b-note{font-size:10.5px;font-weight:600;line-height:1.35;opacity:.95;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .b-date{font-size:9.5px;opacity:.8;font-weight:600}
  .bar.recv{border:1.5px dashed var(--amber);background:rgba(255,180,84,.16)!important;color:#ffd9a3;box-shadow:none}
  .bar.inv{background:rgba(255,255,255,.05)!important;color:var(--mut);box-shadow:none;border:1px dashed var(--line)}
  @media(max-width:640px){.top,.wrap{padding-left:12px;padding-right:12px}.hname,.rname{flex-basis:138px}.rname{font-size:11.5px;padding-left:24px}}
</style>
</head>
<body>
  <div class="top">
    <a class="back" href="/">← 回主控台</a>
    <div><h1>📊 專案時間軸（甘特圖）</h1><div class="sub" id="sub">載入中…</div></div>
  </div>
  <div class="wrap">
    <div class="sumrow" id="sumrow"></div>
    <div class="legend">
      <span class="lg"><span class="swatch sw-fore"></span><b>預計收入</b>：已簽約、本月之後還沒做（未開發票）</span>
      <span class="lg"><span class="swatch sw-recv"></span><b>應收帳款</b>：本月正在做／已交付待收款</span>
      <span class="lg"><span class="swatch sw-past"></span>已過月份（多半已收）淡化</span>
      <br>專案名稱下方紅字＝<span class="psvc"><b>💸外包服務費</b></span>（付給合作夥伴）、<span class="pmed"><b>📺廣告媒體費</b></span>（客戶儲值回補、淨額≈0）。
      <br>每月領錢的專案＝<b>一個月一個方塊</b>；一次性／期間案＝一個大方塊。💰越多金額越大。橘色直欄＝本月。來源：Notion。
    </div>
    <div class="tl"><div class="grid" id="grid"></div></div>
  </div>
<script>
const mn=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
const curM=new Date().getMonth();
const PAL=["#4f8cff","#27c093","#ffb454","#9b7bff","#ff5d6c","#36cfd1","#e8893f","#56c2a4","#c98bff","#f0c563","#7aa0ff","#ef7d92","#5bd0bf","#b0863f"];
const fmt=n=>n.toLocaleString('en-US');
const abbr=v=>!v&&v!==0?"":v>=1e6?(v/1e6).toFixed(1)+"M":v>=1e3?Math.round(v/1e3)+"k":""+v;
const mi=d=>{if(!d)return null;const[y,m]=d.split("-").map(Number);return Math.min(11,Math.max(0,(y-2026)*12+(m-1)));};
const tagOf=n=>{const m=n.match(/^\s*[\[\［]([^\]\］]*)[\]\］]/);return m?m[1].trim():"";};
const strip=n=>n.replace(/^\s*[\[\［][^\]\］]*[\]\］]\s*/,"").replace(/（[^）]*）\s*$/,"").trim()||n;
const scls={"執行中":1,"開發中-洽談中":1,"開發中-初步接觸":1,"暫停":1,"待認領":1};
const cleanNote=s=>(s||"").replace(/^客戶：[^｜|]*[｜|]/,"").replace(/｜?持續中/,"").replace(/^Trello 同步\S*/,"").trim();
// 依金額大小給 💰
function emo(v){ if(v==null||v===0)return""; if(v>=500000)return"💰💰💰💰💰"; if(v>=200000)return"💰💰💰💰"; if(v>=100000)return"💰💰💰"; if(v>=50000)return"💰💰"; if(v>=10000)return"💰"; return"💵"; }
const isMonthly=note=>/每月|月結|月費|每月任務|逐月|依投放量|依量/.test(note||"");
const isInvest=(note,amt)=>/投資/.test(note||"")||amt===0;

fetch('data/notion_projects.json').then(r=>r.json()).then(N=>{
  document.getElementById('sub').textContent=`來源：Notion · 更新 ${N.updated} · 本月＝${mn[curM]}`;
  let rows=N.cards.filter(c=>scls[c.status]&&c.start&&c.due)
    .map(c=>({...c,s:mi(c.start),e:mi(c.due),cust:c.customer||"其他"}))
    .filter(c=>c.s!==null&&c.e!==null&&c.e>=c.s);
  const order=[...new Set(rows.slice().sort((a,b)=>(a.cust<b.cust?-1:1)).map(r=>r.cust))];
  const color={}; order.forEach((c,i)=>color[c]=PAL[i%PAL.length]);
  rows.sort((a,b)=>(a.cust<b.cust?-1:a.cust>b.cust?1:0)||a.s-b.s);

  let recvTot=0, foreTot=0, svcTot=0, mediaTot=0;   // 應收 / 預計 / 應付外包服務 / 廣告媒體(回補)

  let h='<div class="hrow"><div class="hname">專案（依客戶分組）</div><div class="hmon">'
       +mn.map((m,i)=>`<div class="mc ${i===curM?'cur':''}">${m}</div>`).join('')+'</div></div>';
  let lastCust=null;
  rows.forEach(r=>{
    const col=color[r.cust];
    if(r.cust!==lastCust){
      const cnt=rows.filter(x=>x.cust===r.cust).length;
      h+=`<div class="grp"><span class="gd" style="background:${col}"></span>${r.cust}<span class="gt">${cnt} 個專案</span></div>`;
      lastCust=r.cust;
    }
    const bg=`linear-gradient(135deg,${col},${col}cc)`;
    const em=emo(r.amount);
    const invest=isInvest(r.note,r.amount);
    const monthly=isMonthly(r.note);
    const cols=mn.map((m,i)=>`<div class="mcol ${i===curM?'cur':''}" style="left:${i/12*100}%;width:${100/12}%"></div>`).join('');
    let bars='';
    if(monthly){
      // 一個月一個方塊；依時間分類
      for(let i=r.s;i<=r.e;i++){
        const L=i/12*100, W=100/12;
        const cls = i<curM ? 'past' : i===curM ? 'recv' : 'fore';
        if(!invest){ if(cls==='recv') recvTot+=(r.amount||0); else if(cls==='fore') foreTot+=(r.amount||0);
          if(i>=curM){ svcTot+=(r.svc||0); mediaTot+=(r.media||0); } }
        const tag = invest?'投資' : cls==='recv'?'應收' : cls==='fore'?'預計' : '已收';
        const style = invest
          ? 'background:rgba(255,255,255,.05);color:#9aa3b2;box-shadow:none;border:1px dashed #272c3a'
          : `background:${bg}`;
        const amtTxt = r.amount!=null ? abbr(r.amount) : '待定';
        let inner;
        if(invest) inner='<div class="t">投資</div>';
        else if(cls==='past') inner=`<div class="pastn">${r.amount!=null?abbr(r.amount):'·'}</div>`;
        else inner=`<div class="e">${em||'💵'}</div><div class="a">${amtTxt}</div><div class="t">${tag}</div>`;
        bars+=`<div class="bar mblk ${invest?'':cls}" style="left:calc(${L}% + 3px);width:calc(${W}% - 6px);${style}"
          title="${r.name}｜${mn[i]}｜${invest?'投資案（無收入）':'$'+fmt(r.amount||0)+'｜'+tag}｜${cleanNote(r.note)}">${inner}</div>`;
      }
    } else {
      // 一次性 / 期間：依結束月分類
      const L=r.s/12*100, W=(r.e-r.s+1)/12*100;
      const note=cleanNote(r.note);
      let cls,tag;
      if(invest){ cls='inv'; tag='投資案'; }
      else if(r.e<curM){ cls='recv'; tag='應收帳款'; recvTot+=(r.amount||0); }
      else { cls='fore'; tag='預計收入'; foreTot+=(r.amount||0); svcTot+=(r.svc||0); mediaTot+=(r.media||0); }
      const amt=invest?'':(r.amount||r.amount===0)?`${em} $${fmt(r.amount)}`:em;
      const barbg = cls==='fore' ? `style="left:${L}%;width:${W}%;background:${bg}"` : `style="left:${L}%;width:${W}%"`;
      bars=`<div class="bar ${cls==='fore'?'':cls}" ${barbg} title="${r.name}｜${r.start}~${r.due}｜${tag}">
        <div class="b-tag">${tag}</div>
        ${amt?`<div class="b-amt">${amt}</div>`:''}
        ${note?`<div class="b-note">${note}</div>`:''}
        <div class="b-date">${r.start.slice(5)}~${r.due.slice(5)}</div></div>`;
    }
    const tg=tagOf(r.name);
    let disp=strip(r.name);
    if(r.cust&&r.cust!=="其他"){const p=disp.replace(new RegExp('^'+r.cust.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[\\-_、：:　 ]+'),'');if(p)disp=p;}
    const per=monthly?"/月":"";
    let payHtml='';
    if(!invest&&(r.svc||r.media)){
      payHtml='<div class="pay">'
        +(r.svc?`<span class="psvc" title="付給外包/合作夥伴的服務費">💸外包 -${abbr(r.svc)}${per}</span>`:'')
        +(r.media?`<span class="pmed" title="廣告媒體投放費，由客戶以廣告費儲值回補，淨額接近0">📺媒體 -${abbr(r.media)}${per}·回補</span>`:'')
        +'</div>';
    }
    h+=`<div class="row"><div class="rname"><span class="rdot" style="background:${col}"></span>`
      +`<div class="nmline">${tg?`<span class="tag">${tg}</span>`:''}<span class="nm">${disp}</span></div>${payHtml}</div>`
      +`<div class="track">${cols}${bars}</div></div>`;
  });

  document.getElementById('sumrow').innerHTML=
    `<div class="scard recv"><div class="lab">📩 應收帳款</div><div class="val">$${fmt(recvTot)}</div><div class="hint">本月正在做、即將請款</div></div>`+
    `<div class="scard fore"><div class="lab">💰 預計收入</div><div class="val">$${fmt(foreTot)}</div><div class="hint">本月之後已排程、未執行</div></div>`+
    `<div class="scard pay"><div class="lab">💸 應付外包（服務費）</div><div class="val">-$${fmt(svcTot)}</div><div class="hint">接下來要付給外包/合作夥伴</div></div>`+
    `<div class="scard net"><div class="lab">🟰 淨收入（收入−外包）</div><div class="val">$${fmt(recvTot+foreTot-svcTot)}</div><div class="hint">應收＋預計 −外包服務費</div></div>`+
    `<div class="scard med"><div class="lab">📺 廣告媒體費（客戶回補）</div><div class="val">-$${fmt(mediaTot)}</div><div class="hint">先墊投放、客戶儲值回補，淨額≈0</div></div>`;
  document.getElementById('grid').innerHTML=h;
}).catch(e=>{document.getElementById('sub').textContent='載入失敗：'+e;});
</script>
</body>
</html>
