<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>專案時間軸（甘特圖）· 簡單行銷營運中台</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--panel2:#1e2230;--line:#272c3a;--txt:#e7e9ee;--mut:#9aa3b2;--amber:#ffb454;}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Inter","Noto Sans TC",system-ui,"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
  a{color:#4f8cff;text-decoration:none}
  .top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 26px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:30}
  .top h1{font-size:18px;margin:0}.top .sub{color:var(--mut);font-size:12.5px}
  .back{font-size:13px;font-weight:600;padding:7px 13px;border:1px solid var(--line);border-radius:9px;color:var(--txt)}
  .back:hover{background:var(--panel2)}
  .wrap{padding:14px 20px 70px}
  .legend{color:var(--mut);font-size:12.5px;margin:0 2px 12px;line-height:1.6}
  .tl{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:calc(100vh - 150px)}
  .grid{min-width:980px}
  /* header */
  .hrow{display:flex;position:sticky;top:0;z-index:8;background:var(--panel2);border-bottom:1px solid var(--line)}
  .hname{flex:0 0 230px;padding:10px 14px;font-size:11.5px;font-weight:700;color:var(--mut);border-right:2px solid var(--line);position:sticky;left:0;background:var(--panel2);z-index:9}
  .hmon{flex:1;display:flex}
  .hmon .mc{flex:1;text-align:center;padding:10px 0;font-size:11px;font-weight:700;color:var(--mut);border-right:1px solid rgba(39,44,58,.6)}
  .hmon .mc.cur{background:rgba(255,180,84,.22);color:#fff;border-radius:6px 6px 0 0}
  /* client group */
  .grp{display:flex;align-items:center;gap:8px;background:#10131a;border-top:1px solid var(--line);padding:7px 14px;font-size:12px;font-weight:800;position:sticky;left:0;z-index:3}
  .grp .gd{width:11px;height:11px;border-radius:3px;flex-shrink:0}
  .grp .gt{color:var(--mut);font-weight:600;font-size:11px;margin-left:auto}
  /* rows */
  .row{display:flex;align-items:center;height:40px;border-top:1px solid rgba(39,44,58,.45)}
  .row:hover{background:rgba(255,255,255,.025)}
  .rname{flex:0 0 230px;padding:0 14px 0 26px;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:2px solid var(--line);position:sticky;left:0;background:var(--panel);z-index:2}
  .row:hover .rname{background:#1b1f29}
  .rname .rdot{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%}
  .track{flex:1;position:relative;height:100%}
  .mcol{position:absolute;top:0;bottom:0;border-right:1px solid rgba(39,44,58,.4)}
  .mcol.cur{background:rgba(255,180,84,.07)}
  .bar{position:absolute;top:9px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:flex-end;padding:0 9px;font-size:11px;font-weight:800;color:#fff;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.35)}
  .bar.dim{opacity:.5;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.12) 0 5px,transparent 5px 10px)}
  .bar .lbl-out{position:absolute;left:calc(100% + 7px);color:var(--mut);font-size:10.5px;font-weight:700}
  @media(max-width:640px){.top,.wrap{padding-left:12px;padding-right:12px}.hname,.rname{flex-basis:140px}.rname{font-size:11.5px;padding-left:24px}}
</style>
</head>
<body>
  <div class="top">
    <a class="back" href="/">← 回主控台</a>
    <div><h1>📊 專案時間軸（甘特圖）</h1><div class="sub" id="sub">載入中…</div></div>
  </div>
  <div class="wrap">
    <div class="legend">每條橫條＝專案的<b>開始 → 截止</b>；<b>同一個客戶用同一個顏色</b>，左欄是專案名、條上是<b>階段金額</b>。斜紋＝暫停/洽談中。橘色直欄＝本月。來源：Notion。</div>
    <div class="tl"><div class="grid" id="grid"></div></div>
  </div>
<script>
const mn=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
const curM=new Date().getMonth();
const PAL=["#4f8cff","#27c093","#ffb454","#9b7bff","#ff5d6c","#36cfd1","#e8893f","#56c2a4","#c98bff","#f0c563","#7aa0ff","#ef7d92","#5bd0bf","#b0863f"];
const abbr=v=>!v&&v!==0?"":v>=1e6?(v/1e6).toFixed(v%1e6?2:0)+"M":v>=1e3?Math.round(v/1e3)+"k":""+v;
const mi=d=>{if(!d)return null;const[y,m]=d.split("-").map(Number);return Math.min(11,Math.max(0,(y-2026)*12+(m-1)));};
const strip=n=>n.replace(/^\s*[\[\［][^\]\］]*[\]\］]\s*/,"").replace(/（[^）]*）\s*$/,"").trim()||n;
const scls={"執行中":1,"開發中-洽談中":1,"開發中-初步接觸":1,"暫停":1,"待認領":1};
const dimStatus=new Set(["暫停","開發中-洽談中","開發中-初步接觸","待認領"]);

fetch('data/notion_projects.json').then(r=>r.json()).then(N=>{
  document.getElementById('sub').textContent=`來源：Notion · 更新 ${N.updated} · 本月＝${mn[curM]}`;
  let rows=N.cards.filter(c=>scls[c.status]&&c.start&&c.due)
    .map(c=>({...c,s:mi(c.start),e:mi(c.due),cust:c.customer||"其他"}))
    .filter(c=>c.s!==null&&c.e!==null&&c.e>=c.s);
  // 客戶 → 顏色（依全年金額/出現順序）
  const order=[...new Set(rows.sort((a,b)=>(a.cust<b.cust?-1:1)).map(r=>r.cust))];
  const color={}; order.forEach((c,i)=>color[c]=PAL[i%PAL.length]);
  rows.sort((a,b)=>(a.cust<b.cust?-1:a.cust>b.cust?1:0)||a.s-b.s);

  let h='<div class="hrow"><div class="hname">專案（依客戶分組）</div><div class="hmon">'
       +mn.map((m,i)=>`<div class="mc ${i===curM?'cur':''}">${m}</div>`).join('')+'</div></div>';
  let lastCust=null;
  rows.forEach(r=>{
    const col=color[r.cust];
    if(r.cust!==lastCust){
      const cnt=rows.filter(x=>x.cust===r.cust).length;
      h+=`<div class="grp"><span class="gd" style="background:${col}"></span>${r.cust}<span class="gt">${cnt} 個專案</span></div>`;
      lastCust=r.cust;
    }
    const left=r.s/12*100, width=(r.e-r.s+1)/12*100;
    const cols=mn.map((m,i)=>`<div class="mcol ${i===curM?'cur':''}" style="left:${i/12*100}%;width:${100/12}%"></div>`).join('');
    const dim=dimStatus.has(r.status)?'dim':'';
    const amt=r.amount?'$'+abbr(r.amount):'';
    // 短條（<=1.5月）金額放外面，避免擠
    const inside=width>14;
    const lbl= amt ? (inside?amt:`<span class="lbl-out">${amt}</span>`) : '';
    h+=`<div class="row"><div class="rname"><span class="rdot" style="background:${col}"></span>${strip(r.name)}</div>
      <div class="track">${cols}
        <div class="bar ${dim}" style="left:${left}%;width:${width}%;background:${dim?col:'linear-gradient(90deg,'+col+','+col+'cc)'}" title="${r.name}｜${r.start}~${r.due}${r.amount?'｜$'+r.amount.toLocaleString():''}">${inside?amt:''}${!inside?`<span class="lbl-out">${amt}</span>`:''}</div>
      </div></div>`;
  });
  document.getElementById('grid').innerHTML=h;
}).catch(e=>{document.getElementById('sub').textContent='載入失敗：'+e;});
</script>
</body>
</html>
