<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>收款行事曆：各月專案進帳 · 簡單行銷營運中台</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--panel2:#1e2230;--line:#272c3a;--txt:#e7e9ee;--mut:#9aa3b2;--accent:#4f8cff;--green:#27c093;--red:#ff5d6c;--amber:#ffb454;}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Inter","Noto Sans TC",system-ui,"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  .top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 26px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:30}
  .top h1{font-size:18px;margin:0}.top .sub{color:var(--mut);font-size:12.5px}
  .back{font-size:13px;font-weight:600;padding:7px 13px;border:1px solid var(--line);border-radius:9px;color:var(--txt)}
  .back:hover{background:var(--panel2)}
  .wrap{padding:18px 22px 70px}
  .legend{color:var(--mut);font-size:12.5px;margin:0 2px 16px;line-height:1.6}
  .cal{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .m{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px 14px;min-height:150px}
  .m.cur{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
  .m.past{opacity:.62}
  .m-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:9px}
  .m-h .mo{font-size:15px;font-weight:800}
  .m-h .mo .tag{font-size:10px;color:var(--amber);font-weight:700;margin-left:6px}
  .m-h .tot{font-size:12.5px;font-weight:800;color:var(--green)}
  .row{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:3px 0;line-height:1.4}
  .row .p{color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .v{color:var(--mut);font-weight:700;white-space:nowrap}
  .row.big .v{color:var(--txt)}
  .empty{color:var(--mut);font-size:12px;font-style:italic;padding-top:6px}
  @media(max-width:1100px){.cal{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:780px){.cal{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:520px){.cal{grid-template-columns:1fr}.top,.wrap{padding-left:13px;padding-right:13px}}
</style>
</head>
<body>
  <div class="top">
    <a class="back" href="/">← 回主控台</a>
    <div><h1>🗓️ 收款行事曆</h1><div class="sub" id="sub">載入中…</div></div>
  </div>
  <div class="wrap">
    <div class="legend">每個月一格，列出<b>當月各專案的進帳</b>——也就是「完成這個階段這個月能拿到多少錢」。橘框＝本月；月份標題右邊＝當月總進帳。來源：日記帳。</div>
    <div class="cal" id="cal"></div>
  </div>
<script>
const curM=new Date().getMonth();
const mn=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
const fmt=n=>n.toLocaleString('en-US');

fetch('data/projects_monthly.json').then(r=>r.json()).then(P=>{
  document.getElementById('sub').textContent=`來源：日記帳 · 更新 ${P.updated} · 本月＝${mn[curM]}`;
  let html='';
  for(let i=0;i<12;i++){
    const items=P.projects.map(p=>({name:p.name,v:p.rev[i]})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
    const tot=items.reduce((s,x)=>s+x.v,0);
    const cls=i===curM?'cur':(i<curM?'past':'');
    let rows=items.length
      ? items.map((x,idx)=>`<div class="row ${idx===0?'big':''}"><span class="p">${x.name}</span><span class="v">${fmt(x.v)}</span></div>`).join('')
      : '<div class="empty">本月暫無排定進帳</div>';
    html+=`<div class="m ${cls}">
      <div class="m-h"><span class="mo">${mn[i]}${i===curM?'<span class="tag">本月</span>':''}</span><span class="tot">${tot>0?'NT$'+fmt(tot):'—'}</span></div>
      ${rows}</div>`;
  }
  document.getElementById('cal').innerHTML=html;
}).catch(e=>{document.getElementById('sub').textContent='載入失敗：'+e;});
</script>
</body>
</html>
