<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>請款排程：專案 × 月份 · 簡單行銷營運中台</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--panel2:#1e2230;--line:#272c3a;--txt:#e7e9ee;--mut:#9aa3b2;--accent:#4f8cff;--green:#27c093;--red:#ff5d6c;--amber:#ffb454;}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Inter","Noto Sans TC",system-ui,"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  .top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 26px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:30}
  .top h1{font-size:18px;margin:0}.top .sub{color:var(--mut);font-size:12.5px}
  .back{font-size:13px;font-weight:600;padding:7px 13px;border:1px solid var(--line);border-radius:9px;color:var(--txt)}
  .back:hover{background:var(--panel2)}
  .wrap{padding:18px 22px 70px}
  .legend{color:var(--mut);font-size:12.5px;margin:0 2px 14px;line-height:1.6}
  .legend b{color:var(--amber)}
  .tbl-scroll{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:calc(100vh - 165px)}
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;white-space:nowrap}
  th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
  thead th{position:sticky;top:0;background:var(--panel2);color:var(--mut);font-weight:700;font-size:12px;z-index:5}
  th:first-child,td:first-child{position:sticky;left:0;text-align:left;background:var(--panel);font-weight:600;z-index:4;border-right:2px solid var(--line);min-width:120px}
  thead th:first-child{z-index:6;background:var(--panel2)}
  th:last-child,td:last-child{background:#13161d;font-weight:700;border-left:2px solid var(--line)}
  thead th:last-child{background:#1b2030}
  tbody tr:hover td{background:rgba(79,140,255,.07)}
  tbody tr:hover td:first-child{background:#1b1f29}
  .cur{background:rgba(255,180,84,.13)!important}
  thead .cur{background:rgba(255,180,84,.22)!important;color:#fff}
  .past{color:#5b6273}
  .total td{position:sticky;bottom:0;background:#0d1f1a;font-weight:800;border-top:2px solid var(--line);z-index:3}
  .total td:first-child{background:#0d1f1a;z-index:5}
  .total td:last-child{background:#0d2419}
  .total .cur{background:#16301f!important}
  .mut{color:var(--mut)}
  @media(max-width:640px){.top,.wrap{padding-left:13px;padding-right:13px}th,td{padding:8px 9px}}
</style>
</head>
<body>
  <div class="top">
    <a class="back" href="/">← 回主控台</a>
    <div><h1>📆 請款排程：專案 × 月份</h1><div class="sub" id="sub">載入中…</div></div>
  </div>
  <div class="wrap">
    <div class="legend">縱軸＝專案、橫軸＝月份、格子＝該月進帳金額（來源：日記帳）。<b>橘色那欄＝本月</b>，一眼看出這個月哪些專案要完成、會進多少錢；灰字＝已過月份。最下列＝每月總進帳。</div>
    <div class="tbl-scroll"><table id="t"><tbody><tr><td>載入中…</td></tr></tbody></table></div>
  </div>
<script>
const fmt=n=>n.toLocaleString('en-US');
const curM=new Date().getMonth(); // 0-based 本月
const mn=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];

fetch('data/projects_monthly.json').then(r=>r.json()).then(P=>{
  document.getElementById('sub').textContent=`來源：日記帳 · 更新 ${P.updated} · 本月＝${mn[curM]}`;
  const rows=P.projects.filter(p=>p.rev.reduce((a,b)=>a+b,0)>0)
    .map(p=>({name:p.name,rev:p.rev,sum:p.rev.reduce((a,b)=>a+b,0)}))
    .sort((a,b)=>b.sum-a.sum);
  const colTot=mn.map((m,i)=>rows.reduce((s,r)=>s+r.rev[i],0));
  const grand=colTot.reduce((a,b)=>a+b,0);
  const cls=i=>i===curM?'cur':(i<curM?'past':'');
  const cell=(v,i)=>`<td class="${cls(i)}">${v>0?fmt(v):'<span class="mut">·</span>'}</td>`;
  let h='<thead><tr><th>專案</th>'+mn.map((m,i)=>`<th class="${i===curM?'cur':''}">${m}</th>`).join('')+'<th>全年合計</th></tr></thead><tbody>';
  rows.forEach(r=>{
    h+=`<tr><td>${r.name}</td>`+r.rev.map((v,i)=>cell(v,i)).join('')+`<td>${fmt(r.sum)}</td></tr>`;
  });
  h+='<tr class="total"><td>每月總進帳</td>'+colTot.map((v,i)=>`<td class="${i===curM?'cur':''}">${fmt(v)}</td>`).join('')+`<td>${fmt(grand)}</td></tr>`;
  document.getElementById('t').innerHTML=h+'</tbody>';
}).catch(e=>{document.getElementById('sub').textContent='載入失敗：'+e;});
</script>
</body>
</html>
